    function on(elSelector, eventName, selector, fn) {
      var element = document.querySelector(elSelector);
      element.addEventListener(eventName, function (event) {
        var possibleTargets = element.querySelectorAll(selector);
        var target = event.target;
        for (var i = 0, l = possibleTargets.length; i < l; i++) {
          var el = target;
          var p = possibleTargets[i];
          while (el && el !== element) {
            if (el === p) {
              return fn.call(p, event);
            }
            el = el.parentNode;
          }
        }
      });
    }
    on('body', 'click', '.select-control__menu-item', function () {

    function get_document_opacity_0() {
      document.body.style.overflowY = "hidden";
      //document.body.style.marginRight = "20px";

      overlay.style.visibility = "unset";

      container = document.body.querySelector("#fullscreens_container");

    function create_fullscreen(html) {
      container = document.body.querySelector("#fullscreens_container");

      try {
        count_items = container.querySelectorAll(".card_fullscreen").length + 1
      } catch {
        count_items = 0
      };

      if (container.innerHTML) {
        prev_window = container.querySelector(".card_fullscreen");
        prev_window.classList.add("hide");
      };

      $parent_div = document.createElement("div");
      $parent_div.classList.add("card_fullscreen", "mb-30", "border");
      $parent_div.style.zIndex = 100 + count_items;
      $parent_div.style.opacity = "0";

      $hide_span = document.createElement("span");
      $hide_span.classList.add("this_fullscreen_hide");
      $loader = document.createElement("div");

      $loader.setAttribute("id", "fullscreen_loader");
      $hide_span.innerHTML = '<svg class="svg_default" style="position:fixed;" width="30" height="30" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/><path d="M0 0h24v24H0z" fill="none"/></svg>';
      $parent_div.append($hide_span);
      $parent_div.append($loader);
      container.prepend($parent_div);
      $loader.innerHTML = html;
      height = $loader.scrollHeight * 1 + 30;
      if (height < 500) {
        $parent_div.style.height = height + "px";
        $loader.style.overflowY = "unset";

        _height = (window.innerHeight - height - 50) / 2;
        $parent_div.style.top = _height + "px";
        prev_next_height = _height * 1 + 50 + "px";
      } else {

        $parent_div.style.top = "15px";
        $loader.style.overflowY = "auto";
      };
      $parent_div.style.opacity = "1";

      get_document_opacity_0();
    };

function list_step(step) {
  steps_container = form.querySelector(".create-account-layout__content");
  steps = steps_container.querySelectorAll(".form_step_container");
  for (var a = 0; a < steps.length; a++) {
    if (steps[a].getAttribute("data-step") == step) {
      steps[a].classList.remove("hidden");
    }
    else {
      steps[a].classList.add("hidden");
    }
  };
}
function validate_form(form) {
      input_lists = form.querySelectorAll(".required");
      is_first_step_found = false;
      for (var i = 0; i < input_lists.length; i++) {
        if (
          input_lists[i].getAttribute("type") == "text" && input_lists[i].value == ''
        ) {
          
          if (!is_first_step_found) {
            is_first_step_found = true;
            step = input_lists[i].parentElement.parentElement.parentElement.parentElement.getAttribute("data-step");
            if (!step) {
              step = input_lists[i].parentElement.parentElement.parentElement.parentElement.parentElement.getAttribute("data-step");
            }
            if (!step) {
              step = input_lists[i].parentElement.parentElement.parentElement.getAttribute("data-step");
            }
            console.log("step input", step);
            list_step(step);
          }
          input_lists[i].nextElementSibling.innerHTML = "This field is required";
        }
        else if (input_lists[i].getAttribute("type") == "checkbox"){
          checkbox_container = input_lists[i].parentElement.parentElement.parentElement.parentElement.parentElement;
          is_checked = false;
          checkboxs = checkbox_container.querySelectorAll(".required");
          for (var a = 0; a < checkboxs.length; a++) {
            if (checkboxs[a].checked == true) {
              is_checked = true;
              break;
            }
          }
          if (!is_checked) {
            checkbox_container.querySelector(".input-control__footer").innerHTML = "This field is required";
          }
          if (!is_first_step_found) {
            is_first_step_found = true;
            step = input_lists[i].parentElement.parentElement.parentElement.parentElement.parentElement.parentElement.getAttribute("data-step");
            if (!step) {
              step = input_lists[i].parentElement.parentElement.parentElement.parentElement.parentElement.parentElement.parentElement.getAttribute("data-step");
            }
            if (!step) {
              step = input_lists[i].parentElement.parentElement.parentElement.parentElement.parentElement.getAttribute("data-step");
            }
            console.log("step checked", step);
            list_step(step);
          }
        }
      };
  }
