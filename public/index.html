    function on(elSelector, eventName, selector, fn) {
        var element = document.querySelector(elSelector);
        element.addEventListener(eventName, function (event) {
          var possibleTargets = element.querySelectorAll(selector);
          var target = event.target;
          for (var i = 0, l = possibleTargets.length; i < l; i++) {
            var el = target;
            var p = possibleTargets[i];
            while (el && el !== element) {
              if (el === p) {
                return fn.call(p, event);
              }
              el = el.parentNode;
            }
          }
        });
      }

      function create_fullscreen(html) {
        container = document.body.querySelector("#fullscreens_container");

        try {
          count_items = container.querySelectorAll(".card_fullscreen").length + 1
        } catch {
          count_items = 0
        };

        if (container.innerHTML) {
          prev_window = container.querySelector(".card_fullscreen");
          prev_window.classList.add("hide");
        };

        $parent_div = document.createElement("div");
        $parent_div.classList.add("card_fullscreen", "mb-30", "border");
        $parent_div.style.zIndex = 100 + count_items;
        $parent_div.style.opacity = "0";

        $hide_span = document.createElement("span");
        $hide_span.classList.add("this_fullscreen_hide");
        $loader = document.createElement("div");

        $loader.setAttribute("id", "fullscreen_loader");
        $hide_span.innerHTML = '<svg class="svg_default" style="position:fixed;" width="30" height="30" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/><path d="M0 0h24v24H0z" fill="none"/></svg>';
        $parent_div.append($hide_span);
        $parent_div.append($loader);
        container.prepend($parent_div);
        $loader.innerHTML = html;
        height = $loader.scrollHeight * 1 + 30;
        if (height < 500) {
          $parent_div.style.height = height + "px";
          $loader.style.overflowY = "unset";

          _height = (window.innerHeight - height - 50) / 2;
          $parent_div.style.top = _height + "px";

          $parent_div.style.top = "15px";
          $loader.style.overflowY = "auto";
        };
        $parent_div.style.opacity = "1";

        get_document_opacity_0();
      };

ss="input-control mt-1"><div class="d-flex justify-content-between align-items-center"><label class=input-control__label for=id_date>id_signature</label></div><input name=date id=id_date placeholder=""><div class=input-control__footer></div></div><div class=signup-bar><div class="hidden link-button prev_step"data-step=4><img alt=icon src=/static/images/arrow-left-green.svg>Go Back</div><button class="btn btn--green ml-auto normal ripple-effect mediator_form_submit"type=button><span>Submit</span></button></div></div></div><div class="mb-3 login-page__footer"><span class=mr-1>Already have an account?</span> <a class=ajax href=/ >Log in here</a></div></div></form>';
      on('body', 'click', '.signup-page-account', function (e) {
        e.preventDefault();
        href = this.getAttribute("href");
        if (href == "#attorney_register") {
          create_fullscreen(attorney_reg);
        }
        else if (href == "#mediator_register") {
          create_fullscreen(mediator_reg);
        }
        else if (href == "#enterprise_register") {
          create_fullscreen(law_firm_reg);
        }
        else if (href == "#client_register") {
          create_fullscreen(corporate_reg);
        }
      });

      on('body', 'click', '.this_fullscreen_hide', function (e) {
        e.preventDefault();
        close_fullscreen();
      });

      on('body', 'click', '.next_step', function (e) {
          step = this.getAttribute("data-step");
          next_step = step + 1;
          steps_container = this.parentElement.parentElement.parentElement.parentElement;
          current_step_container = this.parentElement.parentElement.parentElement;
          next_step_container = steps_container.querySelector('[data-step=' + '"' + next_step + '"' + ']');
          if (next_step_container) {
            next_step_container.classList.remove("hidden");
            current_step_container.classList.add("hidden");
            this.previousElementSibling.classList.remove("hidden");
          }
        });
        on('body', 'click', '.prev_step', function (e) {
            step = this.getAttribute("data-step");
            prev_step = step - 1;
            steps_container = this.parentElement.parentElement.parentElement.parentElement;
            current_step_container = this.parentElement.parentElement.parentElement;
            prev_step_container = steps_container.querySelector('[data-step=' + '"' + prev_step + '"' + ']');
            if (prev_step_container) {
              prev_step_container.classList.remove("hidden");
              current_step_container.classList.add("hidden");
              if (prev_step == 1) {
                this.previousElementSibling.classList.add("hidden");
              }
            }
          });
